<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8"><style>
{% include "_common.css" %}
  body { font-family: Calibri, "Segoe UI", sans-serif; font-size: 16px; color: #222; margin: 0; padding: 50px 80px; width: 1080px; }
  .parties { display: flex; justify-content: space-between; margin-bottom: 26px; }
  .party { width: 45%; line-height: 1.4; }
  .party .head { font-size: 13px; color: #666; }
  .party .name { font-size: 18px; font-weight: bold; }
  .band { border-top: 3px solid #444; border-bottom: 1px solid #444; padding: 14px 0; margin-bottom: 26px; display: flex; gap: 60px; align-items: flex-start; }
  .band h1 { font-size: 28px; margin: 0; min-width: 190px; }
  table.items tr:nth-child(even) td { background: #f2f2f2; }
  table.items th { border-bottom: 1px solid #444; }
  .totals { margin-top: 14px; }
  .grand td { font-weight: bold; border-top: 1px solid #444; }
</style></head>
<body>
  <div class="parties">
    <div class="party">
      <div class="head"><span data-field="seller" data-role="label">{{ L.seller }}</span></div>
      <div class="name"><span data-field="seller" data-role="value" data-instance="0">{{ v.seller.name }}</span></div>
      <div>CUI {{ v.seller.cui }} | {{ v.seller.reg }}</div>
      <div>{{ v.seller.address }}</div>
    </div>
    <div class="party">
      <div class="head"><span data-field="buyer" data-role="label">{{ L.buyer }}</span></div>
      <div class="name"><span data-field="buyer" data-role="value" data-instance="0">{{ v.buyer.name }}</span></div>
      <div>CUI {{ v.buyer.cui }} | {{ v.buyer.reg }}</div>
      <div>{{ v.buyer.address }}</div>
    </div>
  </div>
  <div class="band">
    <h1>{{ S.title }}</h1>
    {{ meta | safe }}
  </div>
  {% include "_items.html" %}
  {{ extras | safe }}
</body></html>
