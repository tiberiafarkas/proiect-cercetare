[project]
name = "cuebind"
version = "0.1.0"
description = "Cue conflict and causal evidence use in document models on Romanian invoices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2>=3.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "playwright>=1.50",
    "pyarrow>=18.0",
]

[project.optional-dependencies]
models = [
    "accelerate>=1.2",
    "psutil>=6.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.51",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuebind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
